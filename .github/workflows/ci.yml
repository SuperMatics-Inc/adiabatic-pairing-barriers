name: replay-and-paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source manifest and replay pins
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('replay')
          pins = json.loads((root / 'SOURCE-PINS.json').read_text())
          expected = {'linear6_replay.py', 'linear7_replay.py'}
          files = pins.get('files', [])
          if pins.get('format') != 1 or {item.get('path') for item in files} != expected:
              raise SystemExit('Unexpected replay source pin manifest')
          for entry in files:
              source = root / entry['path']
              if hashlib.sha256(source.read_bytes()).hexdigest() != entry['sha256']:
                  raise SystemExit(f'Source pin mismatch: {source}')
          PY
      - name: Install pinned replay dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.5 scipy==1.18.1 mpmath==1.4.1 python-flint==0.9.0
      - name: Default replay and all 36 guarded mutants
        run: |
          set -euo pipefail
          python -B replay/run_all.py | tee replay.out
          grep -qF 'COMBINED: 36/36 mutants rejected; all replay modes passed' replay.out
      - uses: actions/upload-artifact@v4
        with:
          name: adiabatic-pairing-barriers-replay
          path: replay.out
          if-no-files-found: error
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic and poppler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          tectonic --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build and check the manuscript
        working-directory: paper
        run: |
          set -euo pipefail
          tectonic --keep-logs main.tex
          if grep -nE 'Overfull|Underfull|Undefined|Warning|Citation.*undefined|There were' main.log; then exit 1; fi
          test -s main.pdf
          pdfinfo main.pdf > pdfinfo.txt
          grep -Eq '^Pages:[[:space:]]+11$' pdfinfo.txt
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://github.com/SuperMatics-Inc/adiabatic-pairing-barriers' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24384373' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24384385' urls.txt
          pdftotext -layout main.pdf paper-text.txt
          if grep -nE '—|\?\?|reserved|awaits review' paper-text.txt; then exit 1; fi
          if grep -nE 'LINEAR[0-9]*|\bSTAGE[0-9A-Z_-]*\b|HUBHOL|UNIV-GLUE|OPTIMUM|FINITE-ENERGY|\bR7\b' paper-text.txt; then exit 1; fi
          grep -qF 'This preprint has not been peer reviewed.' main.tex
          grep -qF 'This preprint has not been peer reviewed.' ../README.md
      - uses: actions/upload-artifact@v4
        with:
          name: adiabatic-pairing-barriers-paper
          path: |
            paper/main.pdf
            paper/main.log
            paper/main.tex
            paper/refs.bib
            paper/urls.txt
            paper/pdfinfo.txt
            paper/paper-text.txt
          if-no-files-found: error
